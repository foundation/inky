[package]
name = "inky-core"
version = "2.0.0-beta.9"
edition = "2021"
description = "Inky — convert simple HTML into email-safe table markup"
license = "MIT"
repository = "https://github.com/foundation/inky"
readme = "../../README.md"
include = ["src/**/*", "scss/**/*", "Cargo.toml"]

[features]
default = []
css-inlining = ["css-inline"]
templating = ["minijinja", "serde_json"]
serialize = ["serde", "serde_json"]
pipeline = ["dep:grass", "css-inlining", "templating"]

[dependencies]
scraper = { version = "0.22", features = ["deterministic"] }
ego-tree = "0.10"
regex = "1"
css-inline = { version = "0.20", default-features = false, optional = true }
minijinja = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
grass = { version = "0.13.4", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
